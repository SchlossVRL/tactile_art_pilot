<!DOCTYPE html>
<html>

<head>
    <title>Participant View</title>

    <script src="jsPsych/jspsych.js"></script>
    <script src="jsPsych/plugin-html-keyboard-response.js"></script>
    <script src="jsPsych/plugin-fullscreen.js"></script>
    <script src="jsPsych/plugin-preload.js"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

    <link href="jsPsych/jspsych.css" rel="stylesheet" />

    <style>
        body {
            background-color: black;
        }

        img {
            max-width: 80vw;
            max-height: 80vh;
        }
    </style>
</head>

<body></body>

<script>

    async function createExperiment() {
        /* ------------------------------
           Initialize jsPsych
        ------------------------------ */
        const jsPsych = initJsPsych({
        });

        const subject_id = jsPsych.randomization.randomID(10);
        const filename = `${subject_id}.csv`;

        // Prompt for participant ID
        var participant_id = prompt("Please enter the participant ID:");

        // Ensure input is valid
        if (!participant_id || isNaN(participant_id)) {
            alert("Invalid participant ID! Please reload the page and enter a numeric ID.");
            throw new Error("Invalid participant ID.");
        }

        // Add it to every trial's data
        jsPsych.data.addProperties({
            subject_id: subject_id,
            participant_id: participant_id
        });

        // Set background color to gray
        document.body.style.backgroundColor = "rgb(128,128,128)";


        /* ------------------------------
          Inter trial interval 
       ------------------------------ */
        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<div style="font-size:48px">+</div>`,
            choices: "NO_KEYS",
            trial_duration: 500
        };

        function withITI(trials, iti) {
            return trials.flatMap(t => [iti, t]);
        }

        /* ------------------------------
           Stimulus triplets
        ------------------------------ */
        const trial_sets = [
            {
                id: 1,
                participant_img: "images/angry_strong_color.png",
                left_img: "images/angry_strong_texture.png",
                right_img: "images/angry_weak_texture.png"
            },
            {
                id: 2,
                participant_img: "images/angry_strong_color.png",
                left_img: "images/angry_weak_texture.png",
                right_img: "images/angry_strong_texture.png"
            },
            {
                id: 3,
                participant_img: "images/angry_weak_color.png",
                left_img: "images/angry_strong_texture.png",
                right_img: "images/angry_weak_texture.png"
            },
            {
                id: 4,
                participant_img: "images/angry_weak_color.png",
                left_img: "images/angry_weak_texture.png",
                right_img: "images/angry_strong_texture.png"
            },
            {
                id: 5,
                participant_img: "images/disgust_strong_color.png",
                left_img: "images/disgust_strong_texture.png",
                right_img: "images/disgust_weak_texture.png"
            },
            {
                id: 6,
                participant_img: "images/disgust_strong_color.png",
                left_img: "images/disgust_weak_texture.png",
                right_img: "images/disgust_strong_texture.png"
            },
            {
                id: 7,
                participant_img: "images/disgust_weak_color.png",
                left_img: "images/disgust_strong_texture.png",
                right_img: "images/disgust_weak_texture.png"
            },
            {
                id: 8,
                participant_img: "images/disgust_weak_color.png",
                left_img: "images/disgust_weak_texture.png",
                right_img: "images/disgust_strong_texture.png"
            },
            {
                id: 9,
                participant_img: "images/fearful_strong_color.png",
                left_img: "images/fearful_strong_texture.png",
                right_img: "images/fearful_weak_texture.png"
            },
            {
                id: 10,
                participant_img: "images/fearful_strong_color.png",
                left_img: "images/fearful_weak_texture.png",
                right_img: "images/fearful_strong_texture.png"
            },
            {
                id: 11,
                participant_img: "images/fearful_weak_color.png",
                left_img: "images/fearful_strong_texture.png",
                right_img: "images/fearful_weak_texture.png"
            },
            {
                id: 12,
                participant_img: "images/fearful_weak_color.png",
                left_img: "images/fearful_strong_texture.png",
                right_img: "images/fearful_weak_texture.png"
            },
            {
                id: 13,
                participant_img: "images/happy_strong_color.png",
                left_img: "images/happy_strong_texture.png",
                right_img: "images/happy_weak_texture.png"
            },
            {
                id: 14,
                participant_img: "images/happy_strong_color.png",
                left_img: "images/happy_weak_texture.png",
                right_img: "images/happy_strong_texture.png"
            },
            {
                id: 15,
                participant_img: "images/happy_weak_color.png",
                left_img: "images/happy_strong_texture.png",
                right_img: "images/happy_weak_texture.png"
            },
            {
                id: 16,
                participant_img: "images/happy_weak_color.png",
                left_img: "images/happy_strong_texture.png",
                right_img: "images/happy_weak_texture.png"
            },
            {
                id: 17,
                participant_img: "images/sad_strong_color.png",
                left_img: "images/sad_strong_texture.png",
                right_img: "images/sad_weak_texture.png"
            },
            {
                id: 18,
                participant_img: "images/sad_strong_color.png",
                left_img: "images/sad_weak_texture.png",
                right_img: "images/sad_strong_texture.png"
            },
            {
                id: 19,
                participant_img: "images/sad_weak_color.png",
                left_img: "images/sad_strong_texture.png",
                right_img: "images/sad_weak_texture.png"
            },
            {
                id: 20,
                participant_img: "images/sad_weak_color.png",
                left_img: "images/sad_strong_texture.png",
                right_img: "images/sad_weak_texture.png"
            }
        ];

        /* ------------------------------
           Breaks
        ------------------------------ */
        const break1 = makeBreakTrial({
            id: 501,
            stimulus: `<div style="font-size: 48px; color: white;">
                TAKE A BREAK
            </div>`,
            left_img: "images/break_left.png",
            right_img: "images/break_right.png"
        });

        const break2 = makeBreakTrial({
            id: 502,
            stimulus: `<div style="font-size: 48px; color: white;">
                TAKE A BREAK
            </div>`,
            left_img: "images/break_left.png",
            right_img: "images/break_right.png"
        });

        const break3 = makeBreakTrial({
            id: 503,
            stimulus: `<div style="font-size: 48px; color: white;">
                TAKE A BREAK
            </div>`,
            left_img: "images/break_left.png",
            right_img: "images/break_right.png"
        });

        /* ------------------------------
           End
        ------------------------------ */

        const end = makeBreakTrial({
            id: 503,
            stimulus: `<div style="font-size: 48px; color: white;">
                Thank you for your participation, you have completed the experimental trials. 
                <br> You may now remove your headphones so the experimenter can provide next steps.
            </div>`,
            left_img: "images/break_left.png",
            right_img: "images/break_right.png"
        });

        const end_control = [
            {
                id: 1000,
                participant_img: `Thank you for your participation, you have completed the experimental trials. 
                <br> You may now remove your headphones so the experimenter can provide next steps.`,
                left_img: "End",
                right_img: "End"
            }
        ];
        /* ------------------------------
           Randomize trial order
        ------------------------------ */
        const randomized_sets = jsPsych.randomization.shuffle(trial_sets);

        //repetition
        const randomized_sets2 = jsPsych.randomization.shuffle(trial_sets);

        /* ------------------------------
           Open experimenter window
        ------------------------------ */
        let controlWindow = null;

        const openControlWindow = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: "<p>Press SPACE to start.</p>",
            choices: [" "],
            on_finish: () => {
                controlWindow = window.open(
                    "control.html",
                    "experimenter_controls",
                    "width=500,height=300"
                );
            }
        };

        function makeBreakTrial({ id, stimulus, left_img, right_img }) {
            return {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: stimulus,
                choices: "NO_KEYS",

                data: {
                    trial_id: id,
                    trial_type: "break",
                    participant_img: stimulus,
                    left_img: left_img,
                    right_img: right_img
                },

                on_load: () => {
                    controlWindow.postMessage({
                        type: "update_trial",
                        left_img: left_img,
                        right_img: right_img
                    }, "*");
                }
            };
        }

        /* ------------------------------
           Listen for experimenter responses
        ------------------------------ */
        window.addEventListener("message", (event) => {
            if (event.data.type === "response") {
                jsPsych.finishTrial({
                    response: event.data.value
                });
            }
        });

        /* ------------------------------
           Build jsPsych trials
        ------------------------------ */
        const trials = randomized_sets.map(t => ({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<img src="${t.participant_img}">`,
            choices: "NO_KEYS",

            data: {
                trial_id: t.id,
                participant_img: t.participant_img,
                left_img: t.left_img,
                right_img: t.right_img
            },

            on_load: () => {
                // Update experimenter window for this trial
                controlWindow.postMessage({
                    type: "update_trial",
                    left_img: t.left_img,
                    right_img: t.right_img
                }, "*");
            }
        }));

        /* ------------------------------
           Repetition
        ------------------------------ */

        const trials2 = randomized_sets2.map(t => ({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<img src="${t.participant_img}">`,
            choices: "NO_KEYS",

            data: {
                trial_id: t.id,
                participant_img: t.participant_img,
                left_img: t.left_img,
                right_img: t.right_img
            },

            on_load: () => {
                // Update experimenter window for this trial
                controlWindow.postMessage({
                    type: "update_trial",
                    left_img: t.left_img,
                    right_img: t.right_img
                }, "*");
            }
        }));

        //split trials for breaks

        const mid1 = Math.floor(trials.length / 2);
        const mid2 = Math.floor(trials2.length / 2);

        const trials_first_half = trials.slice(0, mid1);
        const trials_second_half = trials.slice(mid1);

        const trials2_first_half = trials2.slice(0, mid2);
        const trials2_second_half = trials2.slice(mid2);





        /* ------------------------------
           End trial
        ------------------------------ */

        /*const end_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `${end_control.participant_img}`,
            choices: "NO_KEYS",

            data: {
                trial_id: end_control.id,
                participant_img: end_control.participant_img,
                left_img: end_control.left_img,
                right_img: end_control.right_img
            },

            on_load: () => {
                // Update experimenter window for this trial
                controlWindow.postMessage({
                    type: "update_trial",
                    left_img: end_control.left_img,
                    right_img: end_control.right_img
                }, "*");
            }
        };*/

        /* ------------------------------
           Preload images
        ------------------------------ */
        const preload = {
            type: jsPsychPreload,
            images: trial_sets.flatMap(t => [
                t.participant_img,
                t.left_img,
                t.right_img
            ])
        };

        /* ------------------------------
           Instructions
        ------------------------------ */
        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
            <h2>Instructions</h2>
            
            <p>Press SPACE to begin the experiment.</p>
        `,
            choices: [" "]
        };

        /* ------------------------------
           Debrief
        ------------------------------ */
        const debrief = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
            
            <p>Thank you for participating in this experiment...</p>
        `,
            choices: [" "]
        };

        /* ------------------------------
           Save Data
        ------------------------------ */
        const save_data = {
            type: jsPsychPipe,
            action: "save",
            experiment_id: "IMErtV4pGj6m",
            filename: filename,
            data_string: () => jsPsych.data.get().csv()
        };

        /* ------------------------------
           Timeline
        ------------------------------ */
        const timeline = [
            preload,
            instructions,
            openControlWindow,
            {
                type: jsPsychFullscreen,
                fullscreen_mode: true
            },
            //...trials_first_half,
            ...withITI(trials_first_half, iti),
            break1,
            //...trials_second_half,
            ...withITI(trials_second_half, iti),

            break2,

            //...trials2_first_half,
            ...withITI(trials2_first_half, iti),
            break3,
            //...trials2_second_half,
            ...withITI(trials2_second_half, iti),
            end,
            save_data,
            debrief
        ];

        jsPsych.run(timeline);
    }

    createExperiment();
</script>

</html>
