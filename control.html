<!DOCTYPE html>
<html>

<head>
    <title>Experimenter Controls</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
        }

        .option {
            text-align: center;
            /* centers label above image */
        }

        .option-label {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        img {
            width: 140px;
            cursor: pointer;
        }

        img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="option">
            <p class="option-label">Left</p>
            <img id="left" onclick="sendResponse('left')">
        </div>

        <div class="option">
            <p class="option-label">Right</p>
            <img id="right" onclick="sendResponse('right')">
        </div>
    </div>

    <script>
        /* ------------------------------
           Receive trial updates
        ------------------------------ */
        window.addEventListener("message", (event) => {
            if (event.data.type === "update_trial") {
                document.getElementById("left").src = event.data.left_img;
                document.getElementById("right").src = event.data.right_img;
            }
        });

        /* ------------------------------
           Send responses
        ------------------------------ */
        function sendResponse(direction) {
            window.opener.postMessage(
                { type: "response", value: direction },
                "*"
            );
        }
    </script>

</body>

</html>
